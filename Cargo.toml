[workspace]
members = ["web"]
default-members = ["."]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MPL-2.0"
authors = ["skymrp project contributors"]
homepage = "https://skymrp.org/"

[package]
name = "skymrp"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "skymrp"
path = "src/main.rs"

[features]
default = ["static"]
lua = ["dep:lunify", "dep:mlua"]
static = ["sdl2/bundled", "sdl2/static-link"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
cc = "1.0.77"
cmake = "0.1.49"
rusty-hook = "0.11.2"

[dependencies]
arm32_cpu = "0.1.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1.5"
encoding_rs = "0.8"
fast-md5 = "1.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lunify = { git = "https://github.com/open-mythroad/lunify", tag = "mythroad-3", optional = true }
mlua = { version = "0.12", features = ["lua51", "vendored"], optional = true }
sdl2 = { version = "0.38.0", features = ["unsafe_textures"] }
sdl2-sys = "0.38.0"
skymrp_sonivox_wrapper = { path = "src/audio/sonivox_wrapper" }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
skymrp_dynarmic_wrapper = { path = "src/cpu/dynarmic_wrapper" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cc = { workspace = true }
cmake = { workspace = true }
rusty-hook = { workspace = true }
